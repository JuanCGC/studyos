<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudIt — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0F172A;--surface:#1E293B;--layer:#263348;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
    --t1:#F1F5F9;--t2:#CBD5E1;--t3:#94A3B8;--t4:#64748B;
    --blue:#3B82F6;--blue2:#60A5FA;--blue3:#2563EB;
    --green:#10B981;--red:#ef4444;
    --font:'Sora',sans-serif;--mono:'DM Mono',monospace;
  }
  html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font)}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

  .auth-wrap{width:100%;max-width:420px}

  .auth-logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:40px}
  .auth-logo-dot{width:44px;height:44px;background:linear-gradient(135deg,var(--blue),var(--green));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
  .auth-logo-text{font-size:24px;font-weight:700;letter-spacing:-0.02em}
  .auth-logo-text span{color:var(--blue2)}

  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px}

  .auth-title{font-size:22px;font-weight:700;margin-bottom:6px}
  .auth-subtitle{font-size:14px;color:var(--t4);margin-bottom:28px;font-family:var(--mono)}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono)}
  .field input{
    width:100%;background:var(--layer);border:1px solid var(--border2);
    border-radius:10px;padding:12px 16px;font-size:14px;color:var(--t1);
    font-family:var(--font);outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--blue)}
  .field input::placeholder{color:var(--t4)}

  .btn-main{
    width:100%;background:var(--blue3);border:none;border-radius:10px;
    padding:13px;font-size:15px;font-weight:700;color:#fff;
    cursor:pointer;transition:background .15s;margin-top:8px;
    font-family:var(--font);
  }
  .btn-main:hover{background:var(--blue)}
  .btn-main:disabled{opacity:0.6;cursor:not-allowed}

  .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--t4);font-size:12px;font-family:var(--mono)}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

  .btn-secondary{
    width:100%;background:transparent;border:1px solid var(--border2);
    border-radius:10px;padding:12px;font-size:14px;color:var(--t2);
    cursor:pointer;transition:all .15s;font-family:var(--font);
  }
  .btn-secondary:hover{background:var(--layer);color:var(--t1)}

  .toggle-link{text-align:center;margin-top:20px;font-size:13px;color:var(--t4)}
  .toggle-link a{color:var(--blue2);cursor:pointer;text-decoration:none;font-weight:600}
  .toggle-link a:hover{text-decoration:underline}

  .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;font-family:var(--mono);display:none}
  .success-msg{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#34d399;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;font-family:var(--mono);display:none}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="auth-logo-dot"><i class="ph ph-book-open"></i></div>
    <div class="auth-logo-text">Stud<span>It</span></div>
  </div>

  <div class="auth-card">
    <!-- Login form -->
    <div id="login-form">
      <div class="auth-title">Welcome</div>
      <div class="auth-subtitle">Sign in to continue</div>
      <div class="error-msg" id="login-error"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-main" id="login-btn" onclick="handleLogin()">Sign In</button>
      <div class="toggle-link">Don't have an account? <a onclick="showRegister()">Sign Up</a></div>
    </div>

    <!-- Register form -->
    <div id="register-form" style="display:none">
      <div class="auth-title">Create Account</div>
      <div class="auth-subtitle">Start your learning path</div>
      <div class="error-msg" id="register-error"></div>
      <div class="success-msg" id="register-success"></div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Minimum 6 characters" autocomplete="new-password">
      </div>
      <button class="btn-main" id="register-btn" onclick="handleRegister()">Create Account</button>
      <div class="toggle-link">Already have an account? <a onclick="showLogin()">Sign In</a></div>
    </div>
  </div>
</div>

<script>
document.addEventListener('securitypolicyviolation', e => {
  console.warn('[CSP] Blocked:', e.blockedURI, '| Directive:', e.violatedDirective);
});

let _sb = null;
let _sbReady = false;

function authFetchWithTimeout(url, options, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

async function initSupabase() {
  let cfg = {};
  try {
    cfg = await fetch('/api/config').then(r => r.json());
  } catch (e) {
    console.warn('[login] Config fetch failed, using fallback values', e);
  }
  if (!cfg.supabaseUrl) cfg.supabaseUrl = 'https://jyasohtnqlracghsxdla.supabase.co';
  if (!cfg.supabaseAnonKey) cfg.supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5YXNvaHRucWxyYWNnaHN4ZGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3ODkxNjMsImV4cCI6MjA5NjM2NTE2M30.lE99l7i3Pxrl6F9EjJSBXvc0oxivRKTzulmvRmkejKY';
  _sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    auth: { fetch: authFetchWithTimeout },
  });
  _sbReady = true;
  const urlErr = new URLSearchParams(location.search).get('error');
  if (urlErr) showError('login-error', decodeURIComponent(urlErr));
  try {
    const { data: { session } } = await _sb.auth.getSession();
    if (session) window.location.replace('/app');
  } catch (e) {
    console.warn('[login] getSession error:', e);
  }
}
initSupabase();

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}
function hideError(id) { document.getElementById(id).style.display = 'none'; }
function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
}
function showLogin() {
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('login-form').style.display = 'block';
}

async function handleLogin() {
  hideError('login-error');
  if (!_sb || !_sbReady) return showError('login-error', 'Auth client not ready. Please wait or refresh.');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showError('login-error', 'Please fill in all fields');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';

  try {
    const { data, error } = await _sb.auth.signInWithPassword({ email, password });
    if (error) {
      showError('login-error', error.message);
      btn.disabled = false; btn.textContent = 'Sign In';
    } else {
      const session = data?.session || (await _sb.auth.getSession()).data?.session;
      if (session) {
        window.location.replace('/app');
      } else {
        showError('login-error', 'Sign-in succeeded but no session was created. Try again or confirm your email.');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }
  } catch (err) {
    const msg = err.name === 'AbortError'
      ? 'Connection timed out. The Supabase project may be paused. Log in at supabase.com to unpause it.'
      : (err.message || 'Unexpected error during sign in');
    showError('login-error', msg);
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

function clearRegisterForm() {
  document.getElementById('reg-name').value = '';
  document.getElementById('reg-email').value = '';
  document.getElementById('reg-password').value = '';
}

async function handleRegister() {
  hideError('register-error');
  if (!_sb || !_sbReady) return showError('register-error', 'Auth client not ready. Please wait or refresh.');
  const fullName = String(document.getElementById('reg-name').value.trim() || '');
  const email    = String(document.getElementById('reg-email').value.trim() || '');
  const password = document.getElementById('reg-password').value;
  if (!fullName || !email || !password) return showError('register-error', 'Please fill in all fields');
  if (password.length < 6) return showError('register-error', 'Password must be at least 6 characters');
  const btn = document.getElementById('register-btn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  const payload = {
    email,
    password,
    options: {
      data: { full_name: fullName },
      emailRedirectTo: window.location.origin + '/app',
    },
  };

  console.log('[signup] payload:', JSON.stringify(payload, null, 2));
  console.log('[Dispatched Payload Path]:', email);

  try {
    const { data, error } = await _sb.auth.signUp(payload);

    if (error) {
      console.error('[signup] error:', { status: error.status, message: error.message, stack: error.stack });
      showError('register-error', `${error.message}${error.status ? ' (HTTP ' + error.status + ')' : ''}`);
      btn.disabled = false; btn.textContent = 'Create Account';
      return;
    }

    if (!data || !data.user) {
      showError('register-error', 'Registration failed. No user was created. Please try again.');
      btn.disabled = false; btn.textContent = 'Create Account';
      return;
    }

    console.log('[signup] success — user created, confirmation pending');
    const suc = document.getElementById('register-success');
    suc.textContent = 'Account created! Please check your inbox to confirm your email address before logging in.';
    suc.style.display = 'block';
    clearRegisterForm();
    btn.disabled = false; btn.textContent = 'Create Account';
  } catch (err) {
    console.error('[signup] exception:', { message: err.message, stack: err.stack });
    showError('register-error', err.message || 'Unexpected error during registration');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('register-form').style.display !== 'none') handleRegister();
    else handleLogin();
  }
});
</script>
</body>
</html>
