<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudIt — Research workflows built smarter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-family:'Inter',system-ui,sans-serif;background:#0B111E;color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{min-height:100vh;display:flex;flex-direction:column}

  .container{max-width:1200px;margin:0 auto;padding:0 24px;width:100%}

  nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid #1E293B}
  .nav-l{display:flex;align-items:center;gap:12px}
  .logo-box{width:40px;height:40px;background:#131C2E;border:1px solid #1E293B;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#3B82F6;flex-shrink:0;line-height:1}
  .logo-text{font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.02em}
  .nav-r{display:flex;align-items:center;gap:16px}
  .nav-link{color:#94A3B8;text-decoration:none;font-size:14px;font-weight:500;transition:color .15s}
  .nav-link:hover{color:#fff}
  .nav-btn{display:inline-flex;align-items:center;gap:6px;background:#131C2E;color:#3B82F6;border:1px solid #1E293B;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;text-decoration:none;transition:all .15s;line-height:1}
  .nav-btn:hover{background:#1E293B;border-color:#3B82F6}

  .hero{flex:1;display:flex;align-items:center;padding:60px 0 80px}
  .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
  .hero h1{font-size:54px;font-weight:800;line-height:1.15;letter-spacing:-0.02em;color:#fff;margin-bottom:20px}
  .hero h1 .pb{display:block}
  .hero p{font-size:17px;line-height:1.65;color:#94A3B8;max-width:520px;margin-bottom:36px}
  .hero-cta{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#0B111E;border:none;border-radius:8px;padding:14px 32px;font-size:15px;font-weight:700;text-decoration:none;transition:all .15s;line-height:1;cursor:pointer}
  .hero-cta:hover{background:#e2e8f0}

  .hero-gfx{position:relative;width:100%;aspect-ratio:4/3;background:#131C2E;border:1px solid #1E293B;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hero-gfx-inner{width:80%;height:75%;background:linear-gradient(135deg,rgba(59,130,246,0.12),rgba(59,130,246,0.04));border:1px solid rgba(59,130,246,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
  .gfx-bar{height:6px;border-radius:3px;background:rgba(59,130,246,0.2)}
  .gfx-bar:nth-child(1){width:60%}
  .gfx-bar:nth-child(2){width:80%}
  .gfx-bar:nth-child(3){width:45%}
  .gfx-bar:nth-child(4){width:70%}
  .gfx-dot{width:32px;height:32px;border-radius:8px;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(59,130,246,0.5)}

  footer{padding:24px 0;border-top:1px solid #1E293B}
  .copy{font-size:13px;color:#475569}

  @media(max-width:768px){
    .container{padding:0 20px}
    nav{padding:16px 0}
    .nav-r .nav-link{display:none}
    .hero{padding:40px 0 60px;text-align:center}
    .hero-grid{grid-template-columns:1fr;gap:40px}
    .hero h1{font-size:36px}
    .hero p{margin-left:auto;margin-right:auto}
    .hero-gfx{aspect-ratio:4/3}
    footer{text-align:center}
  }

  @media(max-width:480px){
    .hero h1{font-size:30px}
    .hero p{font-size:15px}
    .nav-btn{padding:8px 16px;font-size:13px}
  }
</style>
</head>
<body>

  <div class="container">
    <nav>
      <div class="nav-l">
        <div class="logo-box">S</div>
        <span class="logo-text">StudIt</span>
      </div>
      <div class="nav-r">
        <a class="nav-link" href="/login.html">Login</a>
        <a class="nav-btn" href="/login.html">Get started <span style="font-size:18px;line-height:1">→</span></a>
      </div>
    </nav>
  </div>

  <div class="container hero">
    <div class="hero-grid">
      <div>
        <h1>Research workflows<span class="pb">built smarter</span></h1>
        <p>StudIt streamlines your entire academic lifecycle. Design, deploy, and analyze your research studies with unprecedented speed and precision.</p>
        <a class="hero-cta" href="/login.html">Discover StudIt</a>
      </div>
      <div class="hero-gfx">
        <div class="hero-gfx-inner">
          <div class="gfx-dot"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8 3v10" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/></svg></div>
          <div class="gfx-bar"></div>
          <div class="gfx-bar"></div>
          <div class="gfx-bar"></div>
          <div class="gfx-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <footer>
      <span class="copy">&copy; 2026 StudIt</span>
    </footer>
  </div>

  <script>
    var h = window.location.hash;
    if (h) {
      if (h.includes('access_token')) {
        window.location.href = '/dashboard' + h;
      } else if (h.includes('error=')) {
        var p = new URLSearchParams(h.replace('#', ''));
        var d = p.get('error_description') || p.get('error') || 'Unknown error';
        window.location.href = '/login.html?error=' + encodeURIComponent(d);
      }
    }
  </script>

</body>
</html>
